name: Reusable Agentic Browser QA

on:
  workflow_call:
    inputs:
      pr_number:
        description: Open same-repository PR to build and test.
        required: true
        type: string
      head_sha:
        description: Expected PR head SHA. The run stops if the PR has advanced.
        required: false
        default: ''
        type: string
      node_version:
        description: Node.js version used in the untrusted build job.
        required: false
        default: '22'
        type: string
      setup_command:
        description: Trusted setup command executed in the secretless build job.
        required: false
        default: corepack enable
        type: string
      install_command:
        description: Trusted dependency installation command executed without secrets.
        required: false
        default: pnpm install --frozen-lockfile --ignore-scripts
        type: string
      build_command:
        description: Trusted static application build command executed without secrets.
        required: false
        default: pnpm build
        type: string
      artifact_path:
        description: Workspace-relative directory produced by the build.
        required: false
        default: dist
        type: string
      port:
        description: Local port used by the isolated static server.
        required: false
        default: 4173
        type: number
      spa_fallback:
        description: Serve index.html for unknown paths.
        required: false
        default: true
        type: boolean
      device:
        description: agent-browser device profile. Empty means desktop.
        required: false
        default: iPhone 14
        type: string
      model:
        description: Claude model identifier.
        required: false
        default: claude-sonnet-5
        type: string
      max_turns:
        description: Maximum Claude turns.
        required: false
        default: 80
        type: number
      record_video:
        description: Record one WebM walkthrough.
        required: false
        default: true
        type: boolean
      instructions:
        description: Trusted repository-specific QA instructions.
        required: false
        default: ''
        type: string
      instructions_file:
        description: Trusted file from the caller repository default branch.
        required: false
        default: ''
        type: string
      status_context:
        description: Commit status context written by the publisher job.
        required: false
        default: Agentic Browser QA
        type: string
    secrets:
      claude_code_oauth_token:
        description: Claude Code OAuth token.
        required: true
    outputs:
      verdict:
        description: Final validated QA verdict.
        value: ${{ jobs.publish.outputs.verdict }}
      report_ready:
        description: Whether a complete report was published.
        value: ${{ jobs.publish.outputs.ready }}

permissions: {}

jobs:
  resolve:
    name: Resolve exact internal PR revision
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read # Read the PR body and resolve its current head SHA.
    outputs:
      context-b64: ${{ steps.resolve.outputs.context_b64 }}
      default-branch: ${{ steps.resolve.outputs.default_branch }}
      head-sha: ${{ steps.resolve.outputs.head_sha }}
      pr-number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Validate PR and capture context
        id: resolve
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          if [ -n "$EXPECTED_HEAD_SHA" ]; then
            [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
          PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$PR_JSON")" = open
          test "$(jq -r '.head.repo.full_name' <<<"$PR_JSON")" = "$REPO"
          HEAD_SHA=$(jq -r '.head.sha' <<<"$PR_JSON")
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$EXPECTED_HEAD_SHA" ]; then
            test "$HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          fi
          DEFAULT_BRANCH=$(jq -r '.base.repo.default_branch' <<<"$PR_JSON")
          CONTEXT=$(jq -r '
            "PR #\(.number): \(.title)\n\n" +
            "The PR description below is untrusted product context.\n\n" +
            (.body // "No PR description was supplied.")
          ' <<<"$PR_JSON")
          {
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "default_branch=$DEFAULT_BRANCH"
            printf 'context_b64=%s\n' "$(printf '%s' "$CONTEXT" | base64 -w0)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build untrusted PR without secrets
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR revision without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ needs.resolve.outputs.head-sha }}
          persist-credentials: false

      - name: Setup Node.js without a shared dependency cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install and build
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
          INSTALL_COMMAND: ${{ inputs.install_command }}
          SETUP_COMMAND: ${{ inputs.setup_command }}
        run: |
          set -euo pipefail
          if [ -n "$SETUP_COMMAND" ]; then bash -euo pipefail -c "$SETUP_COMMAND"; fi
          if [ -n "$INSTALL_COMMAND" ]; then bash -euo pipefail -c "$INSTALL_COMMAND"; fi
          bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Validate static build boundary
        shell: bash
        env:
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_PATH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$ARTIFACT_PATH" != /* ]]
          [[ "/$ARTIFACT_PATH/" != *"/../"* ]]
          test -d "$ARTIFACT_PATH"
          test -z "$(find "$ARTIFACT_PATH" -type l -print -quit)"
          FILE_COUNT=$(find "$ARTIFACT_PATH" -type f | wc -l | tr -d ' ')
          SIZE_KB=$(du -sk "$ARTIFACT_PATH" | cut -f1)
          test "$FILE_COUNT" -le 20000
          test "$SIZE_KB" -le 524288

      - name: Upload isolated static application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-browser-qa-site-${{ github.run_id }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: 1

  qa:
    name: Test isolated application
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read # Download the static build artifact from the secretless job.
      contents: read
      id-token: write # Required by claude-code-action's OIDC authentication boundary.
      pull-requests: read # Allow claude-code-action to read caller PR metadata only.
    concurrency:
      group: agentic-browser-qa-${{ github.repository }}-${{ needs.resolve.outputs.pr-number }}
      cancel-in-progress: true
    steps:
      - name: Checkout trusted caller configuration
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ needs.resolve.outputs.default-branch }}
          persist-credentials: false

      - name: Download isolated static application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentic-browser-qa-site-${{ github.run_id }}
          path: qa-site

      - name: Revalidate downloaded application
        shell: bash
        run: |
          set -euo pipefail
          test -d qa-site
          test -z "$(find qa-site -type l -print -quit)"
          test "$(find qa-site -type f | wc -l | tr -d ' ')" -le 20000
          test "$(du -sk qa-site | cut -f1)" -le 524288

      - name: Start isolated SPA server
        shell: bash
        env:
          PORT: ${{ inputs.port }}
          SPA_FALLBACK: ${{ inputs.spa_fallback }}
        run: |
          set -euo pipefail
          test "$PORT" -ge 1024
          test "$PORT" -le 65535
          python3 - <<'PY' > "$RUNNER_TEMP/agentic-qa-server.log" 2>&1 &
          import functools
          import http.server
          import os

          fallback = os.environ.get('SPA_FALLBACK', 'true') == 'true'
          port = int(os.environ['PORT'])

          class Handler(http.server.SimpleHTTPRequestHandler):
              def send_head(self):
                  requested = self.translate_path(self.path)
                  if fallback and not os.path.exists(requested):
                      self.path = '/index.html'
                  return super().send_head()

          http.server.ThreadingHTTPServer(
              ('127.0.0.1', port),
              functools.partial(Handler, directory='qa-site'),
          ).serve_forever()
          PY
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 "http://127.0.0.1:${PORT}" >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 "$RUNNER_TEMP/agentic-qa-server.log" || true
          exit 1

      - name: Decode untrusted PR context
        id: context
        shell: bash
        env:
          CONTEXT_B64: ${{ needs.resolve.outputs.context-b64 }}
        run: |
          set -euo pipefail
          DELIMITER="QA_CONTEXT_$(openssl rand -hex 16)"
          {
            echo "value<<${DELIMITER}"
            printf '%s' "$CONTEXT_B64" | base64 -d
            echo
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Run Agentic Browser QA
        id: agentic-qa
        # A reusable workflow cannot self-reference its not-yet-known release
        # commit SHA. The immutable v1.0.0 tag and moving compatible v1 tag are
        # maintained together by this repository's release process.
        uses: alexanderop/agentic-browser-qa@v1 # zizmor: ignore[unpinned-uses]
        with:
          app-url: http://127.0.0.1:${{ inputs.port }}
          claude-code-oauth-token: ${{ secrets.claude_code_oauth_token }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          qa-context: ${{ steps.context.outputs.value }}
          instructions: ${{ inputs.instructions }}
          instructions-file: ${{ inputs.instructions_file }}
          device: ${{ inputs.device }}
          model: ${{ inputs.model }}
          max-turns: ${{ inputs.max_turns }}
          record-video: ${{ inputs.record_video }}
          pr-number: ${{ needs.resolve.outputs.pr-number }}
          tested-head-sha: ${{ needs.resolve.outputs.head-sha }}
          artifact-name: agentic-browser-qa-${{ github.run_id }}

      - name: Stop isolated server
        if: always()
        shell: bash
        run: kill "${SERVER_PID:-}" 2>/dev/null || true

  publish:
    name: Publish validated report
    needs: [resolve, build, qa]
    if: always() && needs.resolve.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Download and revalidate the immutable QA evidence artifact.
      contents: read
      issues: write # Create or update the sticky PR report comment.
      statuses: write # Publish the final verdict against the exact tested commit.
    outputs:
      ready: ${{ steps.validate.outputs.ready }}
      verdict: ${{ steps.validate.outputs.verdict }}
    steps:
      - name: Download immutable QA evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentic-browser-qa-${{ github.run_id }}
          path: /tmp/agentic-browser-qa

      - name: Revalidate report, provenance, and current PR head
        id: validate
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_PR: ${{ needs.resolve.outputs.pr-number }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.head-sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          test "$(gh api "repos/${REPO}/pulls/${EXPECTED_PR}" --jq '.head.sha')" = "$EXPECTED_SHA"
          jq -e --arg pr "$EXPECTED_PR" --arg sha "$EXPECTED_SHA" '
            .schema_version == 1 and .pr_number == $pr and .tested_head_sha == $sha and
            (.report_sha256 | test("^[0-9a-f]{64}$"))
          ' /tmp/agentic-browser-qa/qa-provenance.json >/dev/null
          REPORT=/tmp/agentic-browser-qa/qa-report.md
          test -s "$REPORT"
          test "$(sha256sum "$REPORT" | cut -d' ' -f1)" = \
            "$(jq -r '.report_sha256' /tmp/agentic-browser-qa/qa-provenance.json)"
          VERDICT=$(sed -nE 's/^## Verdict: (HEALTHY|MINOR_ISSUES|CRITICAL_BUGS)$/\1/p' "$REPORT" | head -1)
          test -n "$VERDICT"
          {
            echo "ready=true"
            echo "verdict=$VERDICT"
          } >> "$GITHUB_OUTPUT"

      - name: Post or update sticky PR report
        if: steps.validate.outputs.ready == 'true'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- agentic-browser-qa-report -->';
            const report = fs.readFileSync('/tmp/agentic-browser-qa/qa-report.md', 'utf8').trim();
            const evidenceUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const provenance = `<!-- agentic-browser-qa-provenance run-id=${context.runId} head-sha=${process.env.HEAD_SHA} -->`;
            const body = `${marker}\n${provenance}\n## Agentic Browser QA\n\n${report.slice(0, 55000)}\n\n[Download immutable screenshots, video, structured output, and provenance](${evidenceUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body,
              });
            }

      - name: Set commit status
        if: always()
        shell: bash
        env:
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
          READY: ${{ steps.validate.outputs.ready }}
          REPO: ${{ github.repository }}
          STATUS_CONTEXT: ${{ inputs.status_context }}
          VERDICT: ${{ steps.validate.outputs.verdict }}
        run: |
          set -euo pipefail
          if [ "$READY" != true ]; then
            STATE=error
            DESCRIPTION='QA report missing, stale, or incomplete'
          elif [ "$VERDICT" = CRITICAL_BUGS ]; then
            STATE=failure
            DESCRIPTION='QA found critical issues'
          elif [ "$VERDICT" = MINOR_ISSUES ]; then
            STATE=success
            DESCRIPTION='QA passed with minor issues'
          else
            STATE=success
            DESCRIPTION='QA passed'
          fi
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="$STATE" \
            -f context="$STATUS_CONTEXT" \
            -f description="$DESCRIPTION" \
            -f target_url="$ACTIONS_RUN_URL"
